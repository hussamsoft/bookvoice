name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (py3.11)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-ci.txt
      - name: Install backend dependencies (CPU torch, see requirements-ci.txt)
        run: pip install -r backend/requirements-ci.txt
      - name: Run backend tests
        run: python -m pytest tests -q

  frontend:
    name: Frontend tests + build (node 20)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        # no-undef is enabled so a missing import fails lint rather than
        # reaching the browser as a ReferenceError. Two of those shipped
        # before anything actually ran oxlint.
        run: npm run lint
      - name: Run frontend tests
        run: npm run test
      - name: Build frontend bundle
        run: npm run build
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Check backend/static matches the fresh build
        # build.py runs this same module, but only in a full release build
        # (which needs FFmpeg, the models and PyInstaller), so a stale
        # committed UI bundle shipped in 2.6.0 and 2.6.1 unnoticed.
        run: python ../scripts/check_static_sync.py
